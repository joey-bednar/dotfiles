onboarding = false

[theme]
name = "gruvbox"

[keys]
prefix = "ctrl+a"

next_workspace = "prefix+j"
previous_workspace = "prefix+k"

# free up j/k by moving vertical pane focus elsewhere
focus_pane_down = ["prefix+down", "ctrl+alt+j"]
focus_pane_up = ["prefix+up", "ctrl+alt+k"]

[ui]
prompt_new_tab_name = false
